[package]
name = "ssmart-pos"
version = "1.0.0"
description = "SS Mart — Offline-first POS and inventory management"
authors = ["Manideep Daram"]
edition = "2021"

[lib]
name = "ssmart_pos_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
