<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SS Mart</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
      color: white;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-app-region: drag;
      user-select: none;
    }
    .container {
      text-align: center;
      -webkit-app-region: no-drag;
    }
    .logo {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 32px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      font-size: 13px;
      opacity: 0.6;
    }
    .error {
      display: none;
      background: rgba(239,68,68,0.2);
      border: 1px solid rgba(239,68,68,0.4);
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
      max-width: 400px;
    }
    .error h2 { font-size: 16px; margin-bottom: 8px; color: #fca5a5; }
    .error p { font-size: 12px; opacity: 0.8; }
    .retry-btn {
      margin-top: 12px;
      padding: 8px 20px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 6px;
      color: white;
      font-size: 13px;
      cursor: pointer;
    }
    .retry-btn:hover { background: rgba(255,255,255,0.3); }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🛒</div>
    <h1>SS Mart</h1>
    <p class="subtitle">Sai Sangameshwara Mart — POS System</p>
    <div class="spinner" id="spinner"></div>
    <p class="status" id="status">Starting services...</p>
    <div class="error" id="error">
      <h2>Failed to start</h2>
      <p id="error-msg"></p>
      <button class="retry-btn" onclick="location.reload()">Retry</button>
    </div>
  </div>

  <script>
    // Poll for the frontend to be ready, then redirect
    const statusEl = document.getElementById('status');
    const spinnerEl = document.getElementById('spinner');
    const errorEl = document.getElementById('error');
    const errorMsgEl = document.getElementById('error-msg');

    let attempts = 0;
    const maxAttempts = 60;

    async function checkFrontend() {
      attempts++;
      statusEl.textContent = `Starting services... (${attempts}/${maxAttempts})`;

      try {
        const resp = await fetch('http://localhost:1994/api/health');
        if (resp.ok) {
          statusEl.textContent = 'Ready!';
          spinnerEl.style.display = 'none';
          // Redirect to the actual app
          window.location.href = 'http://localhost:1994/login';
          return;
        }
      } catch (e) {
        // Not ready yet
      }

      if (attempts >= maxAttempts) {
        spinnerEl.style.display = 'none';
        statusEl.style.display = 'none';
        errorEl.style.display = 'block';
        errorMsgEl.textContent = 'Services did not start within 30 seconds. Make sure Node.js is installed.';
        return;
      }

      setTimeout(checkFrontend, 500);
    }

    // Start checking after a short delay
    setTimeout(checkFrontend, 1000);
  </script>
</body>
</html>
